<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Berg Style - Site Oficial</title>
    <style>
        /* ==========================================================================
           RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        :root {
            --bg-main: #0b0b0b;
            --bg-card: #141414;
            --accent-pink: #ff007f;
            --accent-pink-hover: #e00070;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #222222;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ==========================================================================
           HEADER & NAVIGATION
           ========================================================================== */
        header {
            background-color: rgba(11, 11, 11, 0.95);
            border-bottom: 2px solid var(--accent-pink);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-pink);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 2.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-pink);
        }

        /* ==========================================================================
           HERO SECTION
           ========================================================================== */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 2rem;
            margin-top: 80px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(11,11,11,1) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .hero h1 span {
            color: var(--accent-pink);
        }

        .hero p {
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           SECTIONS GENERAL (SPACING CONTROL)
           ========================================================================== */
        section {
            padding: 6rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--accent-pink);
            margin: 10px auto 0;
        }

        /* ==========================================================================
           ROLETA (WHEEL) SECTION - FULLY FUNCTIONAL & ALIGNED
           ========================================================================== */
        .roleta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 2rem 0;
        }

        .wheel-wrapper {
            position: relative;
            width: 450px;
            height: 450px;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid var(--accent-pink);
            z-index: 100;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
        }

        #wheelSvg {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
        }

        .spin-btn {
            margin-top: 3rem;
            background-color: var(--accent-pink);
            color: #000;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .spin-btn:hover {
            background-color: var(--accent-pink-hover);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
        }

        .spin-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Modal de Resultado */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 2px solid var(--accent-pink);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
        }

        .modal-content h3 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--accent-pink);
            text-transform: uppercase;
        }

        .modal-content p {
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .close-btn {
            background-color: var(--accent-pink);
            color: #000;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        footer {
            background-color: #050505;
            border-top: 1px solid var(--border-color);
            padding: 3rem 4rem;
            text-align: center;
            color: var(--text-muted);
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
        }

        footer p {
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">IRON<span>BERG</span></div>
        <nav>
            <a href="#home">Início</a>
            <a href="#roleta">Roleta</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <div class="hero" id="home">
        <h1>BEM-VINDO À <span>IRONBERG</span></h1>
        <p>A maior experiência de alta performance. Onde os limites não existem.</p>
    </div>

    <!-- ROLETA SECTION -->
    <section id="roleta">
        <h2 class="section-title">ROLETA DE PRÊMIOS</h2>
        
        <div class="roleta-container">
            <div class="wheel-wrapper">
                <div class="wheel-pointer"></div>
                <svg id="wheelSvg" viewBox="0 0 500 500">
                    <!-- Gerado via JavaScript para precisão exata dos ângulos e nomes -->
                </svg>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">GIRAR ROLETA</button>
        </div>
    </section>

    <!-- MODAL DE RESULTADO -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h3>PARABÉNS!</h3>
            <p id="modalText">Você ganhou um prêmio!</p>
            <button class="close-btn" onclick="closeModal()">RESGATAR</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 IRONBERG. TODOS OS DIREITOS RESERVADOS.</p>
    </footer>

    <!-- JAVASCRIPT DA ROLETA -->
    <script>
        // Itens da Roleta
        const prizes = [
            "1 MÊS GRÁTIS",
            "COQUETELEIRA",
            "REGATA IRON",
            "SQUEEZE",
            "10% DESCONTO",
            "SUPLEMENTO",
            "TREINO VIP",
            "BONÉ EXCLUSIVO"
        ];

        const colors = [
            "#111111", "#1e1e1e",
            "#111111", "#1e1e1e",
            "#111111", "#1e1e1e",
            "#111111", "#1e1e1e"
        ];

        const svg = document.getElementById("wheelSvg");
        const numSlices = prizes.length;
        const sliceAngle = 360 / numSlices;
        let currentRotation = 0;
        let isSpinning = false;

        // Função para desenhar a roleta com nomes perfeitos e alinhados
        function drawWheel() {
            const center = 250;
            const radius = 240;

            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Converter ângulos para radianos
                const startRad = (startAngle - 90) * Math.PI / 180;
                const endRad = (endAngle - 90) * Math.PI / 180;

                // Pontos da fatia SVG
                const x1 = center + radius * Math.cos(startRad);
                const y1 = center + radius * Math.sin(startRad);
                const x2 = center + radius * Math.cos(endRad);
                const y2 = center + radius * Math.sin(endRad);

                // Caminho da fatia (Arc)
                const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

                // Criar elemento de caminho (Path)
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathData);
                path.setAttribute("fill", colors[i]);
                path.setAttribute("stroke", "#222");
                path.setAttribute("stroke-width", "2");
                svg.appendChild(path);

                // Criar Texto Perfeitamente Alinhado e Centrado
                const textAngle = startAngle + (sliceAngle / 2);
                const textRad = (textAngle - 90) * Math.PI / 180;
                
                // Distância do texto a partir do centro
                const textRadius = radius * 0.65;
                const textX = center + textRadius * Math.cos(textRad);
                const textY = center + textRadius * Math.sin(textRad);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", textX);
                text.setAttribute("y", textY);
                text.setAttribute("fill", "#ffffff");
                text.setAttribute("font-size", "14");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("dominant-baseline", "central");
                
                // Rotacionar texto para alinhar radialmente com a fatia
                text.setAttribute("transform", `rotate(${textAngle}, ${textX}, ${textY})`);
                text.textContent = prizes[i];

                svg.appendChild(text);
            }

            // Borda Externa em Rosa Neon
            const outerCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            outerCircle.setAttribute("cx", center);
            outerCircle.setAttribute("cy", center);
            outerCircle.setAttribute("r", radius);
            outerCircle.setAttribute("fill", "none");
            outerCircle.setAttribute("stroke", "#ff007f");
            outerCircle.setAttribute("stroke-width", "6");
            svg.appendChild(outerCircle);

            // Círculo Central em Rosa Neon
            const centerCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            centerCircle.setAttribute("cx", center);
            centerCircle.setAttribute("cy", center);
            centerCircle.setAttribute("r", "35");
            centerCircle.setAttribute("fill", "#ff007f");
            centerCircle.setAttribute("stroke", "#000");
            centerCircle.setAttribute("stroke-width", "3");
            svg.appendChild(centerCircle);
        }

        // Função de Giro da Roleta
        function spinWheel() {
            if (isSpinning) return;

            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;

            // Sortear prêmio
            const selectedIndex = Math.floor(Math.random() * numSlices);
            
            // Cálculo do ângulo exato para parar no ponteiro do topo (0 graus)
            const targetSliceAngle = selectedIndex * sliceAngle + (sliceAngle / 2);
            const extraRotations = 5 * 360; // 5 voltas completas
            
            // Ângulo final absoluto
            const targetAngle = extraRotations + (360 - targetSliceAngle);
            
            currentRotation += targetAngle;

            // Aplicar rotação no SVG
            svg.style.transform = `rotate(${currentRotation}deg)`;

            // Exibir Resultado após término da animação (4s)
            setTimeout(() => {
                showModal(prizes[selectedIndex]);
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;
            }, 4000);
        }

        function showModal(prize) {
            document.getElementById("modalText").textContent = `Você ganhou: ${prize}!`;
            document.getElementById("resultModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
        }

        // Inicializar a Roleta ao carregar
        drawWheel();
    </script>
</body>
</html>
